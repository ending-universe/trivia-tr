  version: '3.9'

services:
  backend:
    build: ./backend
    container_name: trivia-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - trivia-net

  frontend:
    build: ./frontend
    container_name: trivia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - trivia-net

networks:
  trivia-net:
    driver: bridge
